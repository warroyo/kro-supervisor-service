# Supervisor-specific value overrides. Source of truth for supervisor customizations.
# `make sync` deep-merges this file (these values win) into the upstream chart's
# values.yaml. Edit this file, never service/upstream/values.yaml.

# Set by the Supervisor at install time to the service's namespace (svc-kro-<random>).
# templates/supervisor/ns-overlay.yml moves every chart object into it.
namespace: ""

# Who may create ResourceGraphDefinitions (ClusterRole kro:admin).
# Supervisor identities carry the sso: prefix. Nothing is bound when both are empty.
admins:
  # vSphere SSO groups, e.g. sso:Administrators@vsphere.local
  groups: []
  # vSphere SSO users, e.g. sso:alice@vsphere.local
  users: []

# Ship ClusterRole kro:controller:defaults: the namespaced kinds RGDs commonly
# use on a Supervisor (workloads, config, networking, VMs, VKS clusters, DSM
# databases, Secret Store). See templates/supervisor/controller-defaults.yml.
defaultControllerRules: true

# Extra RBAC rules for the kro controller, on top of the defaults.
# ResourceGraphDefinitions can only manage kinds the controller may touch: list
# a rule here for every other API group and resource your RGDs read
# (externalRef) or create. With multitenancy on, list namespaced kinds only.
# They are rendered into a ClusterRole that aggregates into the controller's role.
# Example:
# controllerRules:
# - apiGroups: ["secretstore.vmware.com"]
#   resources: ["keyvaluesecrets"]
#   verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
controllerRules: []

# Lets platform teams in VCF Automation organizations author their own
# ResourceGraphDefinitions without being Supervisor admins. See
# docs/authoring-modes.md, and scripts/multitenancy-values.sh to print these
# values for a project.
multitenancy:
  enabled: false
  # Client ID of the OIDC identity provider VCF Automation registered on this
  # Supervisor. It is the end of every group VCF Automation sends, the same for
  # all organizations. vCenter shows it under the Supervisor's identity
  # providers; `kubectl auth whoami` shows it after the @ of the edit- group.
  oidcClientId: ""
  # The VCF Automation organizations allowed to author RGDs. Each gets its own
  # API group, <name>.kro.run: tenant RGDs set spec.schema.group to it, and its
  # instances can only be created in that organization's namespaces.
  # id is the UUID in the organization's URN (urn:vcloud:org:<id>).
  # authorProjects are the projects whose editors and admins author RGDs: name
  # and id (the Project's metadata.uid). Any project can be one.
  # Example:
  # orgs:
  # - name: goad
  #   id: 6b1d3f8a-2c4e-4a7b-8d9f-0e5c7a1b3d2f
  #   authorProjects:
  #   - name: kro-authors
  #     id: 9a7e5c3b-1d2f-4e6a-8b0c-4f3d2e1a0b9c
  orgs: []

rbac:
  # Chart default is unrestricted (*/* cluster-wide). On a Supervisor the
  # controller gets only what it needs plus controllerRules.
  mode: aggregation

deployment:
  # Chart default is linux; CRX runs the controller as a vSphere Pod.
  nodeSelector:
    kubernetes.io/os: CRX
