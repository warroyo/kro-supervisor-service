apiVersion: data.packaging.carvel.dev/v1alpha1
kind: PackageMetadata
metadata:
  name: kro.field.vmware.com
spec:
  displayName: kro
  longDescription: installs the KRO operator as a service
  shortDescription: KRO operator
---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: kro.field.vmware.com.1.1.0
spec:
  refName: kro.field.vmware.com
  releasedAt: "2026-10-18T23:20:57Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/warroyo/kro-supervisor-service@sha256:9d1952fbcae341d62fec57b8839f03f91a55e5e8aa87dd50a5d8cd6498848034
      template:
      - helmTemplate:
          name: kro
          namespace: kro
          path: upstream
      - ytt:
          ignoreUnknownComments: true
          paths:
          - '-'
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      properties:
        additionalLabels:
          default: {}
          description: Additional labels that should be applied to all resources
          type: object
        admins:
          description: 'Who may create ResourceGraphDefinitions (ClusterRole kro:admin).
            Supervisor identities carry the sso: prefix. Nothing is bound when both
            are empty.'
          properties:
            groups:
              default: []
              description: vSphere SSO groups, e.g. sso:Administrators@vsphere.local
              items: {}
              type: array
            users:
              default: []
              description: vSphere SSO users, e.g. sso:alice@vsphere.local
              items: {}
              type: array
          type: object
        config:
          description: Application configuration settings
          properties:
            allowCRDDeletion:
              default: false
              description: Allow kro to delete CRDs
              type: boolean
            clientBurst:
              default: 150
              description: The number of requests that can be stored for processing
                before the server starts enforcing the QPS limit
              type: integer
            clientQps:
              default: 100
              description: The maximum number of queries per second to allow
              type: integer
            development:
              default: false
              description: Run logger in development mode (stacktraces on warnings,
                no sampling)
              type: boolean
            dynamicControllerConcurrentReconciles:
              default: 1
              description: The number of dynamic controller reconciles to run in parallel
              type: integer
            dynamicControllerDefaultQueueMaxRetries:
              default: 20
              description: The maximum number of retries for an item in the queue
                will be retried before being dropped
              type: integer
            dynamicControllerDefaultResyncPeriod:
              default: 36000
              description: The interval at which the controller will re list resources
                even with no changes, in seconds
              type: integer
            dynamicControllerRateLimiterBurstLimit:
              default: 100
              description: Burst size allowed through the dynamic controller rate
                limiter
              type: integer
            dynamicControllerRateLimiterMaxDelay:
              default: 1000s
              description: Maximum retry delay before requeueing a dynamic controller
                item
              type: string
            dynamicControllerRateLimiterMinDelay:
              default: 200ms
              description: Minimum retry delay before requeueing a dynamic controller
                item
              type: string
            dynamicControllerRateLimiterRateLimit:
              default: 10
              description: Events per second allowed through the dynamic controller
                rate limiter
              type: integer
            enableControllerWarmup:
              default: false
              description: Enable controller warmup to start controller sources (watches/informers)
                before leader election is won. This pre-populates caches and improves
                leader failover time. Requires enableLeaderElection to be true.
              type: boolean
            enableLeaderElection:
              default: true
              description: Enable leader election for controller manager. Enabling
                this will ensure there is only one active controller manager.
              type: boolean
            featureGates:
              default: {}
              description: 'Feature gates for alpha/experimental features. Each key
                is a feature gate name, each value is a boolean. Example:   featureGates:     CELOmitFunction:
                true'
              type: object
            gracefulShutdownTimeout:
              default: 60s
              description: The maximum duration to wait for the controller manager
                to gracefully shutdown
              type: string
            graphRevisionConcurrentReconciles:
              default: 1
              description: The number of graph revision reconciles to run in parallel
              type: integer
            healthProbeBindAddress:
              default: :8079
              description: The address the probe endpoint binds to
              type: string
            instance:
              properties:
                requeueInterval:
                  default: 3s
                  description: The fixed delay between delayed instance requeues while
                    waiting for cluster state to settle. Set to 0 to disable delayed
                    requeues.
                  type: string
              type: object
            leaderElectionLeaseDuration:
              default: 15s
              description: Duration that non-leader candidates will wait to force
                acquire leadership.
              type: string
            leaderElectionNamespace:
              default: ""
              description: Leader election can be scoped to a specific namespace.
                By default, the controller will attempt to use the namespace of the
                service account mounted to the Controller pod.
              type: string
            leaderElectionRenewDeadline:
              default: 10s
              description: Duration the acting leader will retry refreshing leadership
                before giving up.
              type: string
            leaderElectionRetryPeriod:
              default: 2s
              description: Duration between each leader election action.
              type: string
            logEncoder:
              default: console
              description: 'Log encoder format: ''json'' or ''console'''
              type: string
            logLevel:
              default: info
              description: 'Log level verbosity: ''debug'', ''info'', ''error'', ''panic'',
                or integer > 0'
              type: string
            metricsBindAddress:
              default: :8078
              description: The address the metric endpoint binds to
              type: string
            resourceGraphDefinitionConcurrentReconciles:
              default: 1
              description: The number of resource graph definition reconciles to run
                in parallel
              type: integer
            resourceGraphDefinitionProgressRequeueDelay:
              default: 3s
              description: Delay before requeueing while an RGD is waiting for asynchronous
                progress
              type: string
            rgd:
              properties:
                maxCollectionDimensionSize:
                  default: 10
                  description: Maximum size of collection dimension per forEach defined
                    in ResourceGraphDefinitions
                  type: integer
                maxCollectionSize:
                  default: 1000
                  description: Maximum size of collections generated by forEach in
                    ResourceGraphDefinitions
                  type: integer
                maxGraphRevisions:
                  default: 5
                  description: Maximum number of GraphRevisions to retain per ResourceGraphDefinition
                  type: integer
              type: object
          type: object
        controllerRules:
          default: []
          description: 'Extra RBAC rules for the kro controller. ResourceGraphDefinitions
            can only manage kinds the controller may touch: list a rule here for every
            API group and resource your RGDs read (externalRef) or create. They are
            rendered into a ClusterRole that aggregates into the controller''s role.
            Example: controllerRules: - apiGroups: ["secretstore.vmware.com"]   resources:
            ["keyvaluesecrets"]   verbs: ["get", "list", "watch", "create", "update",
            "patch", "delete"]'
          items: {}
          type: array
        debug:
          description: 'Debugging configuration settings WARNING: pprof profiling
            endpoints expose sensitive performance data. Do not use in production
            environments.'
          properties:
            pprof:
              properties:
                enabled:
                  default: false
                  description: Enable pprof profiling (uses the -debug tagged image)
                    When using image.ko=true, build with GOFLAGS="-tags=pprof".
                  type: boolean
                port:
                  default: 6060
                  description: Port for the pprof HTTP server
                  type: integer
                service:
                  description: Create a Service for pprof (useful for port-forwarding)
                  properties:
                    enabled:
                      default: false
                      type: boolean
                    type:
                      default: ClusterIP
                      type: string
                  type: object
              type: object
          type: object
        deployment:
          properties:
            affinity:
              default: {}
              type: object
            containerPort:
              default: 8078
              description: Port that the container will expose
              type: integer
            dnsPolicy:
              default: ClusterFirst
              description: Set DNS policy for the pod. Defaults to "ClusterFirst".
                Valid values are 'ClusterFirstWithHostNet', 'ClusterFirst', 'Default'
                or 'None'. To have DNS options set along with hostNetwork, you have
                to specify DNS policy explicitly to 'ClusterFirstWithHostNet'.
              type: string
            extraEnv:
              default: []
              description: Additional environment variables for the kro container
              items: {}
              type: array
            extraVolumeMounts:
              default: []
              description: Additional volume mount settings for Pods
              items: {}
              type: array
            extraVolumes:
              default: []
              description: Additional volume settings for Pods
              items: {}
              type: array
            hostNetwork:
              default: false
              description: Specifies the hostname of the Pod. If not specified, the
                pod's hostname will be set to a system-defined value.
              type: boolean
            nodeSelector:
              description: Chart default is linux; CRX runs the controller as a vSphere
                Pod.
              properties:
                kubernetes.io/os:
                  default: CRX
                  type: string
              type: object
            podAnnotations:
              default: {}
              description: Annotations to add to the Pod
              type: object
            podLabels:
              default: {}
              description: Labels to add to the Pod
              type: object
            podSecurityContext:
              description: Security context settings at the Pod level
              properties:
                seccompProfile:
                  properties:
                    type:
                      default: RuntimeDefault
                      type: string
                  type: object
              type: object
            priorityClassName:
              default: ""
              type: string
            replicaCount:
              default: 1
              description: Number of replicas for the Pods to run
              type: integer
            resources:
              description: Resource requests and limits settings
              properties:
                limits:
                  properties:
                    cpu:
                      default: 1000m
                      type: string
                    memory:
                      default: 1024Mi
                      type: string
                  type: object
                requests:
                  properties:
                    cpu:
                      default: 256m
                      type: string
                    memory:
                      default: 128Mi
                      type: string
                  type: object
              type: object
            securityContext:
              description: Security context settings at the container level
              properties:
                allowPrivilegeEscalation:
                  default: false
                  type: boolean
                capabilities:
                  properties:
                    drop:
                      default: []
                      items:
                        default: ALL
                        type: string
                      type: array
                  type: object
                privileged:
                  default: false
                  type: boolean
                runAsNonRoot:
                  default: true
                  type: boolean
                runAsUser:
                  default: 1000
                  type: integer
              type: object
            tolerations:
              default: []
              items: {}
              type: array
            topologySpreadConstraints:
              default: []
              items: {}
              type: array
          type: object
        fullnameOverride:
          default: ""
          description: Override the full name of the chart
          type: string
        image:
          properties:
            ko:
              default: false
              description: Ignores the repository and tag settings and uses the controllers
                ko entrypoint.
              type: boolean
            pullPolicy:
              default: IfNotPresent
              description: 'Image pull policy (IfNotPresent: pull the image only if
                it is not present locally)'
              type: string
            repository:
              default: registry.k8s.io/kro/kro
              description: The location of the container image repository
              type: string
            tag:
              default: v0.9.4
              description: Overrides the image tag whose default is the chart appVersion.
              type: string
          type: object
        imagePullSecrets:
          default: []
          description: List of secrets for pulling images from a private registry
          items: {}
          type: array
        metadata:
          properties:
            includeHelmChart:
              default: true
              type: boolean
            includeManagedBy:
              default: true
              type: boolean
          type: object
        metrics:
          properties:
            service:
              properties:
                create:
                  default: false
                  description: Set to true to automatically create a Kubernetes Service
                    resource for the Prometheus metrics server endpoint in controller
                  type: boolean
                port:
                  default: 8078
                  description: Port for the metrics service
                  type: integer
                type:
                  default: ClusterIP
                  type: string
              type: object
            serviceMonitor:
              properties:
                additionalLabels:
                  default: {}
                  description: Set of labels to transfer from the Kubernetes Service
                    onto the target
                  type: object
                enabled:
                  default: false
                  description: Whether to create a ServiceMonitor
                  type: boolean
                interval:
                  default: 1m
                  description: Set how frequently Prometheus should scrape
                  type: string
                metricRelabelings:
                  default: []
                  description: MetricRelabelConfigs to apply to samples before ingestion
                  items: {}
                  type: array
                relabelings:
                  default: []
                  description: '- action: replace   replacement: my-cluster   targetLabel:
                    cluster'
                  items: {}
                  type: array
                scrapeTimeout:
                  default: 10s
                  description: Set timeout for scrape
                  type: string
                targetLabels:
                  default: []
                  description: Set of labels to transfer from the Kubernetes Service
                    onto the target
                  items: {}
                  type: array
                telemetryPath:
                  default: /metrics
                  description: Set path to metrics path
                  type: string
              type: object
          type: object
        nameOverride:
          default: ""
          description: Override the name of the chart Supervisor-specific value overrides.
            Source of truth for supervisor customizations. `make sync` deep-merges
            this file (these values win) into the upstream chart's values.yaml. Edit
            this file, never service/upstream/values.yaml.
          type: string
        namespace:
          default: ""
          description: Set by the Supervisor at install time to the service's namespace
            (svc-kro-domain-cN). templates/supervisor/ns-overlay.yml moves every chart
            object into it.
          type: string
        rbac:
          properties:
            mode:
              default: aggregation
              description: Chart default is unrestricted (*/* cluster-wide). On a
                Supervisor the controller gets only what it needs plus controllerRules.
              type: string
          type: object
        serviceAccount:
          properties:
            annotations:
              default: {}
              description: Annotations to add to the service account
              type: object
            automount:
              default: true
              description: Automatically mount a ServiceAccount's API credentials?
              type: boolean
            create:
              default: true
              description: Specifies whether a service account should be created
              type: boolean
            name:
              default: ""
              description: The name of the service account to use. If not set and
                create is true, a name is generated using the fullname template
              type: string
          type: object
      type: object
  version: 1.1.0
