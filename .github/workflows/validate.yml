name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        uses: ./.github/actions/setup-tools

      - name: Sync upstream chart and overrides
        run: make sync

      - name: Render and check the package
        run: make validate
