# A template may not create a CRD.
# expect: may not create or reference ResourceGraphDefinitions, GraphRevisions, CRDs, RBAC or admission objects
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mt-deny-crd
spec:
  schema:
    apiVersion: v1alpha1
    kind: MtDeny
    group: __ORG__.kro.run
    spec:
      message: string | default="hello"
  resources:
  - id: configmap
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${schema.metadata.name}-note
      data:
        message: ${schema.spec.message}
  - id: crd
    template:
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: foos.example.com
      spec: {}
