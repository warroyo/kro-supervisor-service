# An externalRef may not read RBAC objects.
# expect: may not create or reference ResourceGraphDefinitions, GraphRevisions, CRDs, RBAC or admission objects
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mt-deny-ref-rbac
spec:
  schema:
    apiVersion: v1alpha1
    kind: MtDeny
    group: __ORG__.kro.run
    spec:
      message: string | default="hello"
  resources:
  - id: configmap
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${schema.metadata.name}-note
      data:
        message: ${schema.spec.message}
  - id: ref
    externalRef:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: anything
