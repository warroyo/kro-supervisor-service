# An externalRef may not take its namespace from a field the instance sets.
# expect: externalRef must name one object in the instance's namespace
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mt-deny-ref-ns-field
spec:
  schema:
    apiVersion: v1alpha1
    kind: MtDeny
    group: __ORG__.kro.run
    spec:
      message: string | default="hello"
      sourceNamespace: string | default="kube-system"
  resources:
  - id: configmap
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${schema.metadata.name}-note
      data:
        message: ${schema.spec.message}
  - id: ref
    externalRef:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kube-root-ca.crt
        namespace: ${schema.spec.sourceNamespace}
