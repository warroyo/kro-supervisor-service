# A tenant RGD in another organization's group.
# expect: Set spec.schema.group: __ORG__.kro.run
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mt-deny-other-org
spec:
  schema:
    apiVersion: v1alpha1
    kind: MtDeny
    group: __OTHER_ORG__.kro.run
    spec:
      message: string | default="hello"
  resources:
  - id: configmap
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${schema.metadata.name}-note
      data:
        message: ${schema.spec.message}
