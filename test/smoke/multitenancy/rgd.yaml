# Tenant RGD, created by a member of the organization's kro author project.
# __ORG__ is replaced with the organization name (KRO_ORG) by multitenancy.sh.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: mt-notes
spec:
  schema:
    apiVersion: v1alpha1
    kind: MtNote
    group: __ORG__.kro.run
    spec:
      message: string | default="hello"
  resources:
  - id: configmap
    template:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ${schema.metadata.name}-note
      data:
        message: ${schema.spec.message}
